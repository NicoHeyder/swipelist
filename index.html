<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Schutzregel (CSP): Die Seite führt nur eigene Skripte und Spotifys Abspiel-Baustein (sdk.scdn.co) aus, spricht nur mit Spotify und lädt Bilder nur von Spotifys Bildservern. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sdk.scdn.co; style-src 'self'; img-src 'self' data: https://*.scdn.co https://*.spotifycdn.com; media-src 'none'; font-src 'self'; connect-src 'self' https://api.spotify.com https://accounts.spotify.com; frame-src https://sdk.scdn.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17171A">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swipelist">
<title>Swipelist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=0.2.1">
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Diese App braucht JavaScript.</p></noscript>
<script src="config.js?v=0.2.1"></script>
<script type="module" src="app.js?v=0.2.1"></script>
</body>
</html>
